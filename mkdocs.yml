site_name: "Workshop de Observabilidad con IBM Instana"
site_description: "Workshop interactivo y práctico para la monitorización de aplicaciones empresariales y análisis de causa raíz con IBM Instana"
site_author: "IBM Client Engineering"
site_url: "https://ibm-automation-spgi.github.io/instana-workshop/"
repo_name: "IBM-Automation-SPGI/instana-workshop"
repo_url: "https://github.com/IBM-Automation-SPGI/instana-workshop"

docs_dir: docs
site_dir: site

theme:
  name: material
  language: es
  palette:
    # Modo claro
    - scheme: default
      primary: custom
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    # Modo oscuro
    - scheme: slate
      primary: custom
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  - styles/custom.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __codelineno
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: true

nav:
  - "Introducción y Arquitectura": index.md
  - "Lab 0 — Entorno, Consola y Dynamic Focus": lab0/index.md
  - "Lab 1 — Infrastructure 3D, 1s Metrics & JVMs": lab1/index.md
  - "Lab 2 — Application Perspectives & Service Flow": lab2/index.md
  - "Lab 3 — 100% Tracing No-Sampling & Analytics": lab3/index.md
  - "Lab 4 — Incidentes, RCA & Change Events": lab4/index.md
  - "Lab 5 — SmartAlerts, SLOs & Custom Dashboards": lab5/index.md
  - "Lab 6 — Kubernetes & OpenShift Observability": lab6/index.md
  - "Lab 7 — OpenTelemetry, SDK & Action Automation": lab7/index.md
